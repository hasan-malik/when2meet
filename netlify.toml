[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev:vite"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = false

# SPA fallback. The API is routed by the function's own `config.path`,
# which takes precedence over this catch-all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
